title: "Décontracté du C'tan"
description: "Et pourquoi pas un peu de texte, en plus des vidéos"
url: "https://decontracte.net"
permalink: /:title/
theme-color: "#222226"
gravatar: 264a76e5b40f4bb39787f617b5164b34

mastodon: thelinuxEXP
twitter: thelinuxEXP

authors:
  nick:
    name: "Nico"
    description: "Nico, l'original"
    gravatar: 264a76e5b40f4bb39787f617b5164b34


plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap

paginate: 7
paginate_path: "/archive/:num/"

# These two blocks reproduce what the github-pages gem used to force on us,
# so articles render exactly as before.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Articles used to get the "post" layout from the jekyll-default-layout plugin.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# The SCSS still uses @import, which Dart Sass 1.x only warns about.
sass:
  quiet_deps: true
  silence_deprecations:
    - import

future: false # Allows us to stage posts
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - admin        # local-only admin app (never published)
  - .github
